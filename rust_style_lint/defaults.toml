# Default rule tables for every checker. A project's rust-style-lint.toml
# overrides a checker section as a whole: when the project defines
# [checker-name], the section replaces the defaults below entirely.
# There is no rule content in the checker code itself.

[forbidden-identifiers]
exclude_filenames = ["schema.rs"]
allowed_modules = []

[[forbidden-identifiers.words]]
word = "result"
code = "FBD001"
replacement = ""
contexts = ["function", "let", "parameter", "const", "static", "enum_variant"]

[[forbidden-identifiers.words]]
word = "res"
code = "FBD002"
replacement = ""
contexts = ["function", "let", "parameter", "const", "static", "enum_variant"]

[[forbidden-identifiers.words]]
word = "error"
code = "FBD003"
replacement = "err"
contexts = ["function", "let", "parameter", "const", "static", "enum_variant", "macro_field"]

[[forbidden-identifiers.words]]
word = "closure"
code = "FBD005"
replacement = ""
contexts = ["function", "let", "parameter", "const", "static", "enum_variant"]

[[forbidden-identifiers.words]]
word = "connection"
code = "FBD006"
replacement = "conn"
contexts = ["function", "let", "parameter", "const", "static", "enum_variant"]

[[forbidden-identifiers.words]]
word = "txn"
code = "FBD007"
replacement = ""
contexts = ["function", "let", "parameter", "const", "static", "enum_variant"]

[[forbidden-identifiers.words]]
word = "tx"
code = "FBD008"
replacement = ""
contexts = ["function", "let", "parameter", "const", "static", "enum_variant"]

[[forbidden-identifiers.words]]
word = "extension"
code = "FBD010"
replacement = "ext"
contexts = ["function", "let", "parameter", "const", "static", "enum_variant", "type", "field"]

[[forbidden-identifiers.words]]
word = "previous"
code = "FBD011"
replacement = "prev"
contexts = ["function", "let", "parameter", "const", "static", "enum_variant"]

[[forbidden-identifiers.words]]
word = "replacements"
code = "FBD012"
replacement = "repl"
contexts = ["function", "let", "parameter", "const", "static", "enum_variant"]

[[forbidden-identifiers.words]]
word = "current"
code = "FBD013"
replacement = "curr"
contexts = ["function", "let", "parameter", "const", "static", "enum_variant"]

[[forbidden-identifiers.prefixes]]
prefix = "target_"
code = "FBD009"
message = "'{name}' starts with forbidden 'target_' prefix"
contexts = ["function", "let", "parameter", "const", "static", "enum_variant", "macro_field"]

[forbidden-identifiers.contextual_word]
word = "err"
error_type_word = "error"
code = "FBD004"
contexts = ["function", "let", "parameter", "const", "static", "enum_variant"]
function_allowed_position = "suffix"
local_allowed_position = "prefix"
function_message = "'{name}' — 'err' in function names only allowed as '_err' suffix"
local_message = "'{name}' — 'err' in local variables only allowed as 'err_' prefix on non-Error types; explicit Error instantiation is forbidden"
other_message = "'{name}' — 'err' is forbidden in this context"

[use-style]
traits = [
    "anyhow::Context",
    "futures::FutureExt",
    "futures::StreamExt",
    "itertools::Itertools",
    "serde::Deserialize",
    "serde::Serialize",
    "std::convert::TryFrom",
    "std::convert::TryInto",
    "std::io::BufRead",
    "std::io::Read",
    "std::io::Write",
    "std::iter::Iterator",
    "tokio_stream::StreamExt",
    "tracing::Instrument",
]

[trait-use-anonymous]
macro_markers = []

[doc-comment-coverage]
exclude_segments = ["tests", "entity"]
exclude_filename_prefixes = ["test_"]
exclude_filenames = ["schema.rs", "entity.rs"]

[visibility-style]
allow_public_fields = []

[spacing-style]
ignore_dirs = [".git", ".hg", ".svn", ".idea", ".vscode", "target", "node_modules"]

[no-inline-format]
# Format-like macros whose token tree starts with the format string
# (write!/writeln! carry the writer first, the format string second).
macros = [
    "format",
    "format_args",
    "print",
    "println",
    "eprint",
    "eprintln",
    "panic",
]
writer_macros = ["write", "writeln"]

[prefer-if-let-guard]
# Macros whose invocation unconditionally diverges, so a match arm calling
# them is a pure guard (like `return` / `break` / `continue`).
diverging_macros = ["panic", "unreachable", "todo", "unimplemented"]
